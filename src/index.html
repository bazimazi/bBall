<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>bBall</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="bBall - a fast, minimal bouncing ball duel. First to 5 wins." />
    <meta name="theme-color" content="#06080f" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2306080f'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%234ff0d6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <canvas id="game" aria-label="bBall playfield" role="img"></canvas>

    <div id="hud" class="hud">
        <button id="soundBtn" class="icon-btn" type="button" aria-label="Mute sound" aria-pressed="false">
            <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z" />
                <path class="wave" d="M15.6 9a4.3 4.3 0 0 1 0 6" />
                <path class="wave" d="M18.2 6.6a7.8 7.8 0 0 1 0 10.8" />
            </svg>
            <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z" />
                <path class="wave" d="m16 9.5 5 5" />
                <path class="wave" d="m21 9.5-5 5" />
            </svg>
        </button>
        <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pause game">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path class="solid" d="M9 5.5h2.2v13H9zm3.8 0H15v13h-2.2z" />
            </svg>
        </button>
    </div>

    <div id="overlay" class="overlay" aria-live="polite">
        <div class="card">
            <div id="panelStart" class="panel">
                <h1 class="logo"><span>b</span>Ball</h1>
                <p class="tagline">First to 5 wins</p>
                <button id="playBtn" class="btn btn-primary" type="button">Play</button>
                <p class="hint" id="startHint">Drag anywhere to move</p>
                <p class="stat" id="startBest"></p>
            </div>

            <div id="panelPause" class="panel">
                <h2 class="heading">Paused</h2>
                <button id="resumeBtn" class="btn btn-primary" type="button">Resume</button>
                <button id="quitBtn" class="btn btn-ghost" type="button">End match</button>
            </div>

            <div id="panelOver" class="panel">
                <h2 class="heading" id="overTitle">You win</h2>
                <p class="score-line"><span id="overYou">0</span><i>:</i><span id="overBot">0</span></p>
                <button id="againBtn" class="btn btn-primary" type="button">Play again</button>
                <p class="stat" id="overBest"></p>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
