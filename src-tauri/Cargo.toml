[package]
name = "bball"
version = "1.0.0"
description = "A fast, minimal bouncing-ball duel."
authors = ["bBall"]
license = "MIT"
repository = "https://github.com/bazimazi/bBall"
edition = "2021"
rust-version = "1.77.2"

# The shell is a library with a thin binary in front of it. Mobile needs the
# library: `tauri android`/`tauri ios` build a native app that calls `run()`
# through the generated entry point, and neither of them runs `main.rs`.
[lib]
name = "bball_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"

# Desktop only. Mobile has one instance by construction, and the crate does
# not build for android/ios targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# A game is the one kind of program where a debug build's frame times are a
# lie, so the dev profile optimises dependencies even when the shell itself
# is unoptimised.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
